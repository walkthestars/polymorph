# Agent-bench seeded corpus (Epic F6) — the deterministic basis of the
# resolve-rate benchmark (see docs/plan-chunk33.md, docs/plan-chunk34.md).
#
# Schema per [[task]] (ORDER MATTERS in TOML, traps #16: task-level keys must
# precede the first [table] header — keys after a [table] header belong to
# that table):
#   id, description: strings.
#   instruction: agent-facing task text (content-specified like F5f: names the
#     failing test + observed vs wanted values + the `cargo test` goal, NEVER
#     solution code — the agent must locate and write the fix).
#   fail_to_pass: test names that FAIL pre-fix (each must appear FAILED).
#   pass_to_pass: test names that PASS pre-fix and must keep passing.
#   [task.files]: initial crate files (dependency-free mini crates; the driver
#     materializes to a tempdir OUTSIDE the repo workspace, so no [workspace]
#     detach needed — the c33 rule applies only to fixtures under target/).
#   [task.fix.files]: EXACT fixed contents (full files, B6 byte-exact spirit).
#
# File bodies use triple-single-quote literals (real newlines; NO escapes —
# a `\n` here would land literally per the c34 driver catch).

[[task]]
id = "sum-off-by-one"
description = "exclusive range drops n: (0..n).sum() instead of (1..=n).sum()"
instruction = "In src/main.rs, the `sum_small` test fails: `sum_first_n(5)` returns 10 but the test wants 15 (`sum_zero` passes). Make `cargo test` pass without touching the tests."
fail_to_pass = ["sum_small"]
pass_to_pass = ["sum_zero"]
[task.files]
"Cargo.toml" = '''[package]
name = "fixture"
version = "0.1.0"
edition = "2021"
'''
"src/main.rs" = '''pub fn sum_first_n(n: u32) -> u32 {
    (0..n).sum()
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn sum_zero() {
        assert_eq!(sum_first_n(0), 0);
    }

    #[test]
    fn sum_small() {
        assert_eq!(sum_first_n(5), 15);
    }
}
'''
[task.fix.files]
"src/main.rs" = '''pub fn sum_first_n(n: u32) -> u32 {
    (1..=n).sum()
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn sum_zero() {
        assert_eq!(sum_first_n(0), 0);
    }

    #[test]
    fn sum_small() {
        assert_eq!(sum_first_n(5), 15);
    }
}
'''

[[task]]
id = "max-flipped"
description = "always-second: max_of ignores a and returns b"
instruction = "In src/main.rs, the `max_first` test fails: `max_of(3, 1)` returns 1 but the test wants 3 (`max_second` passes). Make `cargo test` pass without touching the tests."
fail_to_pass = ["max_first"]
pass_to_pass = ["max_second"]
[task.files]
"Cargo.toml" = '''[package]
name = "fixture"
version = "0.1.0"
edition = "2021"
'''
"src/main.rs" = '''pub fn max_of(a: i32, b: i32) -> i32 {
    let _ = a;
    b
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn max_first() {
        assert_eq!(max_of(3, 1), 3);
    }

    #[test]
    fn max_second() {
        assert_eq!(max_of(1, 3), 3);
    }
}
'''
[task.fix.files]
"src/main.rs" = '''pub fn max_of(a: i32, b: i32) -> i32 {
    if a > b {
        a
    } else {
        b
    }
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn max_first() {
        assert_eq!(max_of(3, 1), 3);
    }

    #[test]
    fn max_second() {
        assert_eq!(max_of(1, 3), 3);
    }
}
'''

