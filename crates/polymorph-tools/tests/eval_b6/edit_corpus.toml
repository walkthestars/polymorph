# Seeded edit corpus — the deterministic basis of the omp-style
# edit benchmark and the eval scoreboard.
#
# Schema per [[task]] (ORDER MATTERS in TOML: `patch` is a task-level key, so
# it must precede the `[task.files]` sub-table header — keys after a [table]
# header belong to that table):
#   id, description: strings.
#   patch: hashline text (triple-quote literal). `{{TAG:path}}` is replaced by
#     the driver's freshly minted tag for that file; a literal tag is verbatim.
#   [task.files]: initial workspace files (UTF-8; \r\n and \uFEFF expressible).
#   corrupt_tag_for = "path": rotate the minted tag's first hex digit (+1 mod
#     16) before substitution — a DETERMINISTIC stale tag (no 1/65536 luck).
#   instruction: natural-language task text for the eval sweep.
#     Task-level key like patch (must precede `[task.files]`). Names the
#     operation AND the exact content in plain words — NEVER hashline syntax
#     (no `[PATH#TAG]` / PUT / CUT / REM / MV keywords): the model must solve
#     the task, not copy a patch. Rejection tasks carry none (they skip
#     before the field is read). Absent `instruction` falls back to
#     `description` (custom corpora; the live-disk test forbids relying
#     on the fallback for these 15).
#   [task.expect.files]: EXACT final workspace state (absent path = must not
#     exist; byte-exact comparison). XOR with:
#   task.expect.error = "StaleTag|Overlap|..." — the patch must fail with that
#     variant AND leave every initial file byte-identical with no temp files.

[[task]]
id = "replace-single-line"
description = "PUT N replaces one line, terminator preserved"
instruction = 'In a.txt, replace line 2 (`two`) with `TWO`. Keep lines 1 and 3 and the trailing newline exactly as they are.'
patch = '''
[a.txt#{{TAG:a.txt}}]
PUT 2:
+TWO
'''
[task.files]
"a.txt" = "one\ntwo\nthree\n"
[task.expect.files]
"a.txt" = "one\nTWO\nthree\n"

[[task]]
id = "replace-range"
description = "PUT N.=M replaces an inclusive range"
instruction = 'In b.txt, replace lines 2 and 3 (`l2` and `l3`) with two lines reading `X` and `Y`. Keep lines 1 (`l1`) and 4 (`l4`) exactly.'
patch = '''
[b.txt#{{TAG:b.txt}}]
PUT 2.=3:
+X
+Y
'''
[task.files]
"b.txt" = "l1\nl2\nl3\nl4\n"
[task.expect.files]
"b.txt" = "l1\nX\nY\nl4\n"

[[task]]
id = "insert-prepend"
description = "PUT <1 inserts before the first line"
instruction = 'In c.txt, insert a new first line reading `top`, pushing the existing lines down, so the file reads `top`, `a`, `b`.'
patch = '''
[c.txt#{{TAG:c.txt}}]
PUT <1:
+top
'''
[task.files]
"c.txt" = "a\nb\n"
[task.expect.files]
"c.txt" = "top\na\nb\n"

[[task]]
id = "insert-append"
description = "PUT >N inserts after the last line"
instruction = 'In d.txt, which currently holds lines `a`, `b`, `c`, append a new final line reading `bottom`.'
patch = '''
[d.txt#{{TAG:d.txt}}]
PUT >3:
+bottom
'''
[task.files]
"d.txt" = "a\nb\nc\n"
[task.expect.files]
"d.txt" = "a\nb\nc\nbottom\n"

[[task]]
id = "cut-delete"
description = "CUT N deletes one line"
instruction = 'In e.txt, delete line 2 (`k2`) so the file reads `k1`, `k3`.'
patch = '''
[e.txt#{{TAG:e.txt}}]
CUT 2
'''
[task.files]
"e.txt" = "k1\nk2\nk3\n"
[task.expect.files]
"e.txt" = "k1\nk3\n"

[[task]]
id = "cut-paste-move"
description = "CUT to register + PUT paste moves lines within the file"
instruction = 'In f.txt, move line 1 (`a`) to the end of the file, so it reads `b`, `c`, `d`, `a`.'
patch = '''
[f.txt#{{TAG:f.txt}}]
CUT 1 @m
PUT >4 @m
'''
[task.files]
"f.txt" = "a\nb\nc\nd\n"
[task.expect.files]
"f.txt" = "b\nc\nd\na\n"

[[task]]
id = "multi-hunk-stable-numbering"
description = "Two hunks address ORIGINAL lines (no shifting mid-patch)"
instruction = 'In g.txt, change line 1 from `1` to `A` and change line 4 from `4` to `D`, counting original line numbers for both changes.'
patch = '''
[g.txt#{{TAG:g.txt}}]
PUT 1:
+A
PUT 4:
+D
'''
[task.files]
"g.txt" = "1\n2\n3\n4\n"
[task.expect.files]
"g.txt" = "A\n2\n3\nD\n"

[[task]]
id = "multi-file"
description = "Two sections apply to two files in one patch"
instruction = 'In h1.txt, change the single line from `x` to `X`. In h2.txt, change the single line from `y` to `Y`.'
patch = '''
[h1.txt#{{TAG:h1.txt}}]
PUT 1:
+X
[h2.txt#{{TAG:h2.txt}}]
PUT 1:
+Y
'''
[task.files]
"h1.txt" = "x\n"
"h2.txt" = "y\n"
[task.expect.files]
"h1.txt" = "X\n"
"h2.txt" = "Y\n"

[[task]]
id = "atomicity-second-section-stale"
description = "Stale second section fails BEFORE the first file is touched"
corrupt_tag_for = "i2.txt"
patch = '''
[i1.txt#{{TAG:i1.txt}}]
PUT 1:
+AAA
[i2.txt#{{TAG:i2.txt}}]
PUT 1:
+BBB
'''
[task.files]
"i1.txt" = "aaa\n"
"i2.txt" = "m\n"
[task.expect]
error = "StaleTag"

[[task]]
id = "stale-tag"
description = "Changed-since-read content rejects with StaleTag, file untouched"
corrupt_tag_for = "j.txt"
patch = '''
[j.txt#{{TAG:j.txt}}]
PUT 1:
+replaced
'''
[task.files]
"j.txt" = "v1\nv2\n"
[task.expect]
error = "StaleTag"

[[task]]
id = "overlap-rejected"
description = "Intersecting affected ranges reject the whole patch"
patch = '''
[k.txt#{{TAG:k.txt}}]
PUT 1.=2:
+X
CUT 2.=3
'''
[task.files]
"k.txt" = "1\n2\n3\n4\n"
[task.expect]
error = "Overlap"

[[task]]
id = "out-of-bounds"
description = "Line past end-of-file rejects with OutOfBounds"
patch = '''
[l.txt#{{TAG:l.txt}}]
PUT 9:
+x
'''
[task.files]
"l.txt" = "a\nb\n"
[task.expect]
error = "OutOfBounds"

[[task]]
id = "traversal-rejected"
description = "Paths escaping the workspace root are rejected"
patch = '''
[../evil.txt#ffff]
PUT 1:
+x
'''
[task.files]
"innocent.txt" = "stay\n"
[task.expect]
error = "Traversal"

[[task]]
id = "rem-file"
description = "REM deletes the whole file"
instruction = 'Delete the file m.txt entirely.'
patch = '''
[m.txt#{{TAG:m.txt}}]
REM
'''
[task.files]
"m.txt" = "bye\n"
[task.expect.files]

[[task]]
id = "mv-file"
description = "MV renames, preserving bytes"
instruction = 'Rename n.txt to o.txt, preserving its bytes exactly.'
patch = '''
[n.txt#{{TAG:n.txt}}]
MV o.txt
'''
[task.files]
"n.txt" = "data\n"
[task.expect.files]
"o.txt" = "data\n"

[[task]]
id = "noop-detected"
description = "Replacing lines with identical content succeeds as a no-op"
instruction = 'In p.txt the two lines already read `same` and `lines`. Rewrite that identical content so the file is byte-for-byte unchanged.'
patch = '''
[p.txt#{{TAG:p.txt}}]
PUT 1:
+same
'''
[task.files]
"p.txt" = "same\nlines\n"
[task.expect.files]
"p.txt" = "same\nlines\n"

[[task]]
id = "crlf-preserved"
description = "CRLF files keep CRLF endings through the edit"
instruction = 'In q.txt, which uses CRLF line endings, change line 1 from `a` to `X`. Preserve CRLF endings on every line.'
patch = '''
[q.txt#{{TAG:q.txt}}]
PUT 1:
+X
'''
[task.files]
"q.txt" = "a\r\nb\r\n"
[task.expect.files]
"q.txt" = "X\r\nb\r\n"

[[task]]
id = "bom-preserved"
description = "UTF-8 BOM survives the edit"
instruction = 'In r.txt, which starts with a UTF-8 BOM followed by `a` on line 1, change line 2 from `b` to `Y`. Preserve the BOM and all endings.'
patch = '''
[r.txt#{{TAG:r.txt}}]
PUT 2:
+Y
'''
[task.files]
"r.txt" = "\uFEFFa\nb\n"
[task.expect.files]
"r.txt" = "\uFEFFa\nY\n"

[[task]]
id = "sigil-escaping"
description = "++x means literal +x; lone + means an empty line"
instruction = 'In s.txt, replace line 1 (`old`) with two lines: first a literal `+x`, then an empty line.'
patch = '''
[s.txt#{{TAG:s.txt}}]
PUT 1:
++x
+
'''
[task.files]
"s.txt" = "old\n"
[task.expect.files]
"s.txt" = "+x\n\n"

[[task]]
id = "unicode-content"
description = "Non-ASCII replacement content round-trips as UTF-8"
instruction = 'In t.txt, replace line 1 (`hello`) with exactly `héllo 🌍`, encoded as UTF-8.'
patch = '''
[t.txt#{{TAG:t.txt}}]
PUT 1:
+héllo 🌍
'''
[task.files]
"t.txt" = "hello\n"
[task.expect.files]
"t.txt" = "héllo 🌍\n"
