[package]
name = "polymorph-swe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Polymorph: a Rust-native execution substrate for AI coding harnesses, with a headless SWE compiler and clean-context reviewer loop."

[[bin]]
name = "polymorph"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
clap.workspace = true
clap_complete.workspace = true
figment.workspace = true
futures.workspace = true
toml.workspace = true
polymorph-core = { version = "1.0.0", path = "../polymorph-core" }
polymorph-drive = { version = "1.0.0", path = "../polymorph-drive" }
polymorph-mcp = { version = "1.0.0", path = "../polymorph-mcp" }
polymorph-llm = { version = "1.0.0", path = "../polymorph-llm" }
polymorph-delegate = { version = "1.0.0", path = "../polymorph-delegate" }
polymorph-review = { version = "1.0.0", path = "../polymorph-review" }
polymorph-tasks = { version = "1.0.0", path = "../polymorph-tasks" }
polymorph-tools = { version = "1.0.0", path = "../polymorph-tools" }

[dev-dependencies]
tempfile.workspace = true
sha2.workspace = true
