# Prompt-pack manifest (Epic A6 + F5 — ENFORCED, not a placeholder)
#
# This file pins sha256 of every pack file. CI FAILS on drift (unlisted file,
# missing file, or hash mismatch). To change a prompt:
#   1. Edit prompts/{model}/{role}.md
#   2. Update the sha256 below (Epic D automates this via `polymorph config`)
#   3. Commit BOTH the .md and this manifest (F5 eval gate runs on the pair).
# Deprecation policy: never delete a pack file in the same PR that changes
# behavior — deprecate (rename to *.deprecated.md, keep hash row) for one
# milestone, then remove.
