name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly run: surfaces toolchain and dependency drift early.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  verify:
    name: Build, Clippy, Test & Format (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: SMT solver for the proof gate
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check z3-solver
          bin="$(python -c 'import os, sys; print(os.path.join(sys.prefix, "bin"))')"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/z3" --version

      - name: Build workspace
        run: cargo build --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        # The solver is provisioned above: a missing `z3` must fail, not skip.
        env:
          POLYMORPH_REQUIRE_Z3: "1"
        run: cargo test --workspace --locked --no-fail-fast

      - name: MCP proof tool end to end
        # Drives the built binary over MCP; ignored by default because it needs it.
        shell: bash
        env:
          POLYMORPH_REQUIRE_Z3: "1"
        run: |
          exe="$PWD/target/debug/polymorph"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$(pwd -W)/target/debug/polymorph.exe"; fi
          POLYMORPH_BIN="$exe" cargo test -p polymorph-mcp --locked -- --ignored

      - name: Verify prompt manifest (prompts.toml)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File crates/polymorph-prompts/prompts | ForEach-Object { $_.FullName.Replace("$PWD\", "").Replace("\", "/") }
          $manifest = Get-Content prompts.toml -Raw
          $missing = @()
          foreach ($f in $files) { if ($manifest -notmatch [regex]::Escape($f)) { $missing += $f } }
          if ($missing.Count -gt 0) { Write-Error "Unlisted prompt files: $($missing -join ', ')"; exit 1 }
          Write-Output "Prompt files verified: $($files.Count)"
