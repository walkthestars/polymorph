name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  verify:
    name: Build, Clippy, Test & Format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: TEMP-DIAG worktree path form
        continue-on-error: true
        shell: pwsh
        run: |
          git --version
          Write-Output "TEMP=$env:TEMP"
          Write-Output "TMP=$env:TMP"
          Write-Output "GetTempPath=$([System.IO.Path]::GetTempPath())"
          $d = Join-Path ([System.IO.Path]::GetTempPath()) ("diag" + [guid]::NewGuid().ToString("N").Substring(0,6))
          New-Item -ItemType Directory -Path $d | Out-Null
          Write-Output "dir=$d"
          Write-Output "short=$((New-Object -ComObject Scripting.FileSystemObject).GetFolder($d).ShortPath)"
          git -C $d init -b main | Out-Null
          git -C $d config core.autocrlf false
          Set-Content -Path (Join-Path $d "f.txt") -Value "v1"
          git -C $d add .
          git -C $d -c user.email=t@t -c user.name=t commit -m seed --quiet
          New-Item -ItemType Directory -Path (Join-Path $d "wt") | Out-Null
          git -C $d worktree add --detach (Join-Path $d "wt/c1") HEAD
          Write-Output "--- worktree list ---"
          git -C $d worktree list

      - name: Build workspace
        run: cargo build --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Verify prompt manifest (prompts.toml)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File prompts | ForEach-Object { $_.FullName.Replace("$PWD\", "").Replace("\", "/") }
          $manifest = Get-Content prompts.toml -Raw
          $missing = @()
          foreach ($f in $files) { if ($manifest -notmatch [regex]::Escape($f)) { $missing += $f } }
          if ($missing.Count -gt 0) { Write-Error "Unlisted prompt files: $($missing -join ', ')"; exit 1 }
          Write-Output "Prompt files verified: $($files.Count)"

      - name: Verify ACP dependency pin
        shell: pwsh
        run: |
          $lock = Get-Content Cargo.lock -Raw
          if ($lock -notmatch 'name = "agent-client-protocol"\r?\nversion = "2\.1\.0"') { Write-Error "ACP pin drifted from 2.1.0"; exit 1 }
          Write-Output "ACP pin verified: 2.1.0"
